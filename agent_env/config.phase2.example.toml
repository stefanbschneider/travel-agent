[phase2.llm]
# OpenAI-compatible Phase 2 parser/refinement endpoint example for a local or organizer-provided
# SGLang server. Copy this block into your ignored agent_env/config.toml when you want a reachable
# endpoint without changing the deterministic library defaults.
backend = "openai"
base_url = "http://127.0.0.1:30000/v1"
model = "Qwen/Qwen3.6-27B"
api_key = ""
api_key_env = "OPENAI_API_KEY"
temperature = 0.0
max_tokens = 1024
