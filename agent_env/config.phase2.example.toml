[phase2.llm]
# OpenAI-compatible Phase 2 parser/refinement endpoint. base_url and model below are the exact
# organizer-confirmed evaluation deployment (2026-08-04 organizer email reply on the LLM API):
#
#   CUDA_VISIBLE_DEVICES=0,1 sglang serve --model-path /mnt/hdd/local_llm/Qwen3.6-27B \
#     --served-model-name Qwen3.6-27B --host 0.0.0.0 --port 30000 --tp-size 2 --dtype bfloat16 \
#     --context-length 131072 --mem-fraction-static 0.85 --chunked-prefill-size 4096 \
#     --max-running-requests 8 --reasoning-parser qwen3 --tool-call-parser qwen3_coder
#
# Copy this block into your ignored agent_env/config.toml to point at that endpoint (or an
# equivalent local SGLang/vLLM instance serving the same model) without changing the deterministic
# library defaults -- TPC_P2_LLM_BACKEND still defaults to "none" and this file itself is untracked
# as agent_env/config.toml, so the packaged submission never reaches it unless an operator
# explicitly configures and measures it (see docs/tpc_phase2_roadmap.md's LLM packaging section).
# `--max-running-requests 8` caps server-side concurrency: more than 8 in-flight requests (e.g. from
# several of the whole-run scheduler's parallel workers calling the LLM at once) queue or time out
# on the server side, independent of this client's own timeout.
backend = "openai"
base_url = "http://127.0.0.1:30000/v1"
model = "Qwen3.6-27B"
api_key = ""
api_key_env = "OPENAI_API_KEY"
temperature = 0.0
max_tokens = 1024
