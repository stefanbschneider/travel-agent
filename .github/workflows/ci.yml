name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run unit tests
        run: python -m pytest

      # Runs in a scratch directory with no cache/ or results/, which is the state the organizers
      # unpack into. A worker crash during start-up breaks the pool, and the run still exits 0
      # while emitting empty fallback plans for the whole split -- so nothing above catches it.
      # See tests/phase2/test_cold_start.py.
      - name: Cold-start check (packaged path, multiple workers, pristine tree)
        run: python -m pytest tests/phase2/test_cold_start.py -m integration -q
